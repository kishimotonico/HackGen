name: Build v2.10 baseline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin historical HackGen version
        run: sed -i 's/hackgen_version="2.11.0"/hackgen_version="2.10.0"/' make_hackgen.sh

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fontforge \
            ttfautohint \
            unzip

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Python tools
        run: |
          python -m pip install 'fonttools==3.44.0' 'freetype-py==2.5.1'
          ttx --version

      - name: Show tool versions
        run: |
          fontforge --version
          ttfautohint --version
          python --version
          ttx --version

      - name: Build HackGen
        run: |
          chmod +x \
            make_hackgen.sh \
            hackgen_generator.sh \
            copyright.sh \
            os2_patch.sh \
            cmap_patch.sh

          set +e
          ./make_hackgen.sh 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "$status" > build.exit
          exit 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build.log
            build.exit
          if-no-files-found: warn

      - name: Check build result
        run: |
          status=$(cat build.exit)
          if [ "$status" -ne 0 ]; then
            echo "HackGen build failed with exit code $status"
            exit "$status"
          fi

      - name: Verify generated fonts
        run: |
          test -d build
          find build -maxdepth 1 -type f -name 'HackGen*.ttf' -print
          count=$(find build -maxdepth 1 -type f -name 'HackGen*.ttf' | wc -l)
          test "$count" -eq 12

      - name: Download official v2.10.0 release
        run: |
          mkdir -p reference/normal reference/nf
          curl --fail --location --retry 3 \
            --output /tmp/HackGen_v2.10.0.zip \
            https://github.com/yuru7/HackGen/releases/download/v2.10.0/HackGen_v2.10.0.zip
          curl --fail --location --retry 3 \
            --output /tmp/HackGen_NF_v2.10.0.zip \
            https://github.com/yuru7/HackGen/releases/download/v2.10.0/HackGen_NF_v2.10.0.zip
          unzip -q /tmp/HackGen_v2.10.0.zip -d reference/normal
          unzip -q /tmp/HackGen_NF_v2.10.0.zip -d reference/nf
          find reference -type f -name 'HackGen*.ttf' -print

      - name: Compare with official v2.10.0
        run: |
          python tools/compare_fonts.py \
            --generated build \
            --reference reference \
            --json font-comparison.json \
            --markdown font-comparison.md
          cat font-comparison.md

      - name: Compare rasterized output
        run: |
          python tools/compare_rendering.py \
            --generated build \
            --reference reference \
            --json render-comparison.json \
            --markdown render-comparison.md
          cat render-comparison.md

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-comparison-v2.10.0
          path: |
            font-comparison.json
            font-comparison.md
            render-comparison.json
            render-comparison.md
          if-no-files-found: warn

      - name: Upload fonts
        uses: actions/upload-artifact@v4
        with:
          name: hackgen-v2.10.0
          path: build/*.ttf
          if-no-files-found: error
