name: Build fonts

on:
  workflow_dispatch:
  push:
    branches:
      - ci/build-fonts

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fontforge \
            ttfautohint \
            python3-pip

      - name: Install fontTools
        run: |
          python3 -m pip install --break-system-packages 'fonttools==3.44.0'
          ttx --version

      - name: Show tool versions
        run: |
          fontforge --version
          ttfautohint --version
          python3 --version
          ttx --version

      - name: Build HackGen
        run: |
          chmod +x \
            make_hackgen.sh \
            hackgen_generator.sh \
            copyright.sh \
            os2_patch.sh \
            cmap_patch.sh

          set +e
          ./make_hackgen.sh 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "$status" > build.exit
          exit 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build.log
            build.exit
          if-no-files-found: warn

      - name: Check build result
        run: |
          status=$(cat build.exit)
          if [ "$status" -ne 0 ]; then
            echo "HackGen build failed with exit code $status"
            exit "$status"
          fi

      - name: Verify generated fonts
        run: |
          test -d build
          find build -maxdepth 1 -type f -name 'HackGen*.ttf' -print
          count=$(find build -maxdepth 1 -type f -name 'HackGen*.ttf' | wc -l)
          test "$count" -gt 0

      - name: Upload fonts
        uses: actions/upload-artifact@v4
        with:
          name: hackgen-v2.10.0
          path: build/*.ttf
          if-no-files-found: error
