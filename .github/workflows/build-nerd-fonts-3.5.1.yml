name: Build with Nerd Fonts 3.5.1

on:
  workflow_dispatch:
  push:
    branches:
      - ci/build-fonts
    paths:
      - '.github/workflows/build-nerd-fonts-3.5.1.yml'
      - 'hackgen_generator.sh'
      - 'make_hackgen.sh'
      - 'copyright.sh'
      - 'os2_patch.sh'
      - 'cmap_patch.sh'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge ttfautohint unzip

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Python tools
        run: python -m pip install 'fonttools==3.44.0'

      - name: Download Nerd Fonts 3.5.1 Hack
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/Hack.zip \
            https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/Hack.zip
          echo 'fa24da7de7cefe7766614d27762570b20453c852fc1d5b657111666df9a5e449  /tmp/Hack.zip' | sha256sum --check -
          mkdir -p /tmp/nerd-hack
          unzip -q /tmp/Hack.zip -d /tmp/nerd-hack
          find /tmp/nerd-hack -maxdepth 1 -type f -name '*.ttf' -print | sort

      - name: Select Nerd Font source files
        run: |
          regular=$(find /tmp/nerd-hack -maxdepth 1 -type f -name 'HackNerdFont-Regular.ttf' | head -n 1)
          bold=$(find /tmp/nerd-hack -maxdepth 1 -type f -name 'HackNerdFont-Bold.ttf' | head -n 1)
          test -n "$regular"
          test -n "$bold"
          cp "$regular" source/HackNerdFont-Regular.ttf
          cp "$bold" source/HackNerdFont-Bold.ttf

      - name: Inspect Nerd Font source coverage
        run: |
          python - <<'PY'
          from fontTools.ttLib import TTFont
          ranges = [
              ('Seti-UI + Custom', 0xE5FA, 0xE6B7),
              ('Devicons', 0xE700, 0xE8E3),
              ('Font Awesome Extension', 0xE200, 0xE2A9),
              ('Weather', 0xE300, 0xE3E3),
              ('Codicons', 0xEA60, 0xEC1E),
              ('Font Awesome', 0xED00, 0xF2FF),
              ('Font Logos', 0xF300, 0xF381),
              ('Octicons', 0xF400, 0xF533),
              ('Material Design', 0xF0001, 0xF1AF0),
          ]
          for path in ('source/HackNerdFont-Regular.ttf', 'source/HackNerdFont-Bold.ttf'):
              cmap = TTFont(path).getBestCmap() or {}
              print(path, 'mapped=', len(cmap), 'max=U+%X' % max(cmap))
              for name, start, end in ranges:
                  count = sum(cp in cmap for cp in range(start, end + 1))
                  print('  %-24s %4d mapped in U+%04X..U+%04X' % (name, count, start, end))
          PY

      - name: Build HackGen
        run: |
          chmod +x make_hackgen.sh hackgen_generator.sh copyright.sh os2_patch.sh cmap_patch.sh
          ./make_hackgen.sh 2>&1 | tee build-nerd-fonts-3.5.1.log

      - name: Verify generated fonts
        run: |
          count=$(find build -maxdepth 1 -type f -name 'HackGen*.ttf' | wc -l)
          test "$count" -eq 12
          python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          for path in sorted(Path('build').glob('HackGen*NF*.ttf')):
              font = TTFont(str(path))
              cmap = font.getBestCmap() or {}
              print(path.name, 'glyphs=', len(font.getGlyphOrder()), 'mapped=', len(cmap), 'max=U+%X' % max(cmap))
          PY

      - name: Upload fonts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hackgen-nerd-fonts-3.5.1-test
          path: |
            build/*.ttf
            build-nerd-fonts-3.5.1.log
          if-no-files-found: warn
