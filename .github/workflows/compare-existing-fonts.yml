name: Compare existing font artifacts

on:
  push:
    branches:
      - ci/build-fonts
    paths:
      - '.github/workflows/compare-existing-fonts.yml'
      - 'tools/compare_rendering.py'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install comparison dependencies
        run: python -m pip install 'fonttools==3.44.0' 'freetype-py==2.5.1'

      - name: Download generated fonts from successful run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          gh api \
            -H 'Accept: application/vnd.github+json' \
            /repos/${{ github.repository }}/actions/artifacts/9618815846/zip \
            > /tmp/generated.zip
          unzip -q /tmp/generated.zip -d build
          find build -type f -name 'HackGen*.ttf' -print

      - name: Download official v2.10.0 release
        run: |
          mkdir -p reference/normal reference/nf
          curl --fail --location --retry 3 \
            --output /tmp/HackGen_v2.10.0.zip \
            https://github.com/yuru7/HackGen/releases/download/v2.10.0/HackGen_v2.10.0.zip
          curl --fail --location --retry 3 \
            --output /tmp/HackGen_NF_v2.10.0.zip \
            https://github.com/yuru7/HackGen/releases/download/v2.10.0/HackGen_NF_v2.10.0.zip
          unzip -q /tmp/HackGen_v2.10.0.zip -d reference/normal
          unzip -q /tmp/HackGen_NF_v2.10.0.zip -d reference/nf

      - name: Compare hinted and unhinted rendering
        run: |
          python tools/compare_rendering.py \
            --generated build \
            --reference reference \
            --json render-comparison.json \
            --markdown render-comparison.md
          cat render-comparison.md

      - name: Upload rendering comparison
        uses: actions/upload-artifact@v4
        with:
          name: render-comparison-hinted-unhinted
          path: |
            render-comparison.json
            render-comparison.md
          if-no-files-found: error
